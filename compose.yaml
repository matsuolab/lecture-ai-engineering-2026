
services:
  streamlit:
    build: .
    working_dir: /app
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      # Windows側のソースコードを共有
      - .:/app

      # Linux専用の仮想環境を保持
      - python_venv:/app/.venv

    environment:
      UV_LINK_MODE: copy
      WATCHDOG_USE_POLLING: "true"

volumes:
  python_venv:
