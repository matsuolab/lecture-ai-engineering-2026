[project]
name = "aie2026-exercises"
version = "0.1.0"
description = "AIE2026 演習・宿題用リポジトリ（学習支援エージェントを育てる）"
readme = "README.md"
requires-python = ">=3.12"
# 年度中に壊れないよう、バージョンは固定する
dependencies = [
    "google-genai==2.31.0",
    "pydantic-ai-slim[google,mcp]==2.57.0",  # mcp は第5回（MCP サーバー・クライアント）で使う
]

[dependency-groups]
dev = ["pytest>=8"]
adk = ["google-adk==2.13.0"]  # 第3回 宿題（発展）: ADK での再実装・adk web での比較用

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]
